name: gfxati spec lanes

on:
  push:
    branches: [gfxati-flash]
  pull_request:
    paths:
      - gfxati-flash.c
      - gfxati-flash.h
      - gfxati-flash-test.c
      - gfxati-flash.allium
      - gfxati_flash.tla
      - gfxati_flash.cfg
      - gfxati-card/**
      - .github/workflows/allium-specula.yml

jobs:
  gfxati:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and self-test the flash model
        run: |
          cc -Wall -Wextra -o gfxati-flash-test \
            gfxati-flash.c gfxati-flash-test.c
          ./gfxati-flash-test

      - name: Build and self-test the gfxati card device
        run: |
          cc -Wall -Wextra -o gfxati_card_test \
            gfxati-flash.c gfxati-card/gfxati_card.c \
            gfxati-card/gfxati_card_test.c
          ./gfxati_card_test

      - name: Build the probe kernel (boot attestation)
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-multilib
          gcc -m32 -ffreestanding -nostdlib -static -fno-stack-protector \
            -Wl,-e,main -T gfxati-card/probe/probe.lds \
            -o probe.elf gfxati-card/probe/probe.c

      - name: Install the allium CLI (pinned)
        run: cargo install allium-cli --version 3.5.3 --locked

      - name: allium check, analyse, plan
        run: |
          allium check gfxati-flash.allium
          allium analyse gfxati-flash.allium
          allium plan gfxati-flash.allium

      - name: Install host-lifecycle (pinned)
        run: |
          cargo install host-lifecycle \
            --git https://github.com/connollydavid/host-lifecycle \
            --rev 66c24d6de0833b8bafc58c5c875ab23b9303c47a --locked

      - name: Obligations discharged by the self-test
        run: |
          host-lifecycle obligations gfxati-flash.allium \
            --tests . --strict-discharge

      - name: Model-check the timing spec with TLC
        run: |
          curl -sS -o tla2tools.jar https://nightly.tlapl.us/dist/tla2tools.jar
          java -XX:+UseParallelGC -Xmx4G -jar tla2tools.jar \
            -config gfxati_flash.cfg gfxati_flash.tla
